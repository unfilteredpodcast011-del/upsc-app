name: examprep
description: "ExamPrep - UPSC & TNPSC Timed Practice Mobile App"
publish_to: 'none'

version: 1.1.1+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Firebase Core & Auth
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  firebase_app_check: ^0.3.0+1
  google_sign_in: ^6.2.1

  # Payments
  razorpay_flutter: ^1.3.7

  # UI, Fonts & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Data Processing & Storage
  excel: ^4.0.3
  csv: ^6.0.0
  file_picker: 13.0.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  supabase_flutter: ^2.18.3
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.2
  tamil_pdf_shaper: ^1.0.4
  flutter_native_html_to_pdf: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/images/
    - assets/fonts/
